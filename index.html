<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DEEP//SHIFT</title><link rel="stylesheet" href="style.css"></head><body>
<div id="boot"><div class="brand">DEEP//SHIFT</div><div class="sub">VR MINING PROTOCOL · EUROPA SECTOR 7</div><button id="deploy">DEPLOY TO SHAFT</button><div class="keys">WASD MOVE · MOUSE LOOK · CLICK MINE · E SCAN · SHIFT BOOST</div></div>
<canvas id="c"></canvas>
<div id="hud"><div class="top"><div class="chip"><b>DS-07</b><span>OPERATOR</span></div><div class="depth"><small>DEPTH</small><strong id="depth">1,842m</strong></div><div class="clock"><span class="live"></span>SUIT LINK</div></div>
<div id="reticle"><i></i><i></i></div><div id="scanring"></div><div id="toast"></div>
<div class="left"><div class="label">SUIT INTEGRITY</div><div class="bar"><i id="hp"></i></div><div class="metric"><span>O₂</span><b id="oxy">93%</b></div><div class="metric"><span>POWER</span><b id="power">81%</b></div></div>
<div class="right"><div class="objective">ACTIVE CONTRACT<small>Extract 12kg of cobalt glass</small><div class="progress"><i id="prog"></i></div><b><span id="ore">0.0</span> / 12.0 KG</b></div><div id="cargo"></div></div>
<div class="bottom"><div class="tool"><span>PLASMA CUTTER</span><b>MK IV</b></div><div class="heat"><small>THERMAL LOAD</small><div><i id="heat"></i></div></div><div class="credits">₡ <b id="credits">2,450</b></div></div>
<div id="radar"><div class="sweep"></div><i class="blip b1"></i><i class="blip b2"></i><i class="me"></i></div>
</div><script type="module" src="game.js"></script></body></html>
